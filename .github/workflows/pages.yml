name: pages

# Publishes docs/site to GitHub Pages: the marketing page, plus the demo (built from test-app
# into docs/site/demo) and the guide (built from docs-app into docs/site/guide).
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'test-app/app/**'
      - 'test-app/index.html'
      - 'test-app/public/**'
      - 'docs-app/**'
      - 'packages/*/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm demo:build
      - run: pnpm guide:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v5
