name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: lint, format, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node --test scripts/*.test.mjs

  test:
    name: test (ember ${{ matrix.ember }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest stable and the previous LTS.
        ember: ['7.3', '6.12']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Appended under the `overrides:` key that ends pnpm-workspace.yaml's overrides block,
      # so the addons' dev copy and the test app agree on one ember-source.
      - name: Pin ember-source ${{ matrix.ember }}
        if: matrix.ember != '7.3'
        run: |
          sed -i "s/^  '@formwright\/maskito': 'workspace:\*'$/&\n  ember-source: ~${{ matrix.ember }}.0/" pnpm-workspace.yaml
          grep -n ember-source pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
        if: matrix.ember == '7.3'
      - run: pnpm build
      # The suite runs in the runner's preinstalled Chrome.
      - run: pnpm test

  examples:
    name: example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [ember-classic]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter ${{ matrix.example }} test
